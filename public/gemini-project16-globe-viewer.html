<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Globe - Gemini Eval (Project 16)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info { position: absolute; top: 20px; left: 20px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        #tooltip {
            position: absolute; display: none; background: rgba(0, 0, 0, 0.85);
            color: #fff; padding: 6px 12px; border-radius: 6px; border: 1px solid #1a73e8;
            pointer-events: none; transform: translate(-50%, -150%);
            font-size: 14px; transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); backdrop-filter: blur(4px);
        }
        button {
            background: rgba(26, 115, 232, 0.8); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 10px 20px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; backdrop-filter: blur(5px); transition: all 0.2s;
        }
        button:hover { background: rgba(21, 87, 176, 1); transform: translateY(-2px); }
        .instructions { font-size: 13px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; border: 1px solid #333; line-height: 1.5; color: #ccc;}
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; z-index: 20; pointer-events: none; color: #1a73e8; font-weight: bold;}
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #1a73e8; animation: spin 1s ease-in-out infinite; margin-right: 10px; vertical-align: middle;}
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Import maps polyfill -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading"><div class="spinner"></div>Loading Earth Assets...</div>
    <div id="info">
        <button id="toggleBtn">🌓 Toggle Night/Day</button>
        <div class="instructions">
            • Drag to rotate the globe<br>
            • Scroll to zoom in/out<br>
            • Hover over red markers to see cities<br>
            • Auto-rotation stops on hover/drag
        </div>
    </div>
    <div id="tooltip">City Name</div>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // CONFIGURATION & TEXTURE URLs
        // ==========================================
        // You can change these URLs to point to any valid texture maps.
        const DAY_TEXTURE_URL = 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
        const NIGHT_TEXTURE_URL = 'https://unpkg.com/three-globe/example/img/earth-night.jpg';
        const BUMP_TEXTURE_URL = 'https://unpkg.com/three-globe/example/img/earth-topology.png';
        const EARTH_RADIUS = 1;

        // ==========================================
        // SCENE SETUP
        // ==========================================
        const container = document.getElementById('container');
        const tooltip = document.getElementById('tooltip');
        const loading = document.getElementById('loading');
        
        const scene = new THREE.Scene();
        
        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 3.5);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // optimize for high DPI
        container.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 8;
        controls.enablePan = false;

        let isDragging = false;
        controls.addEventListener('start', () => { isDragging = true; });
        controls.addEventListener('end', () => { isDragging = false; });

        // ==========================================
        // LIGHTING
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2); // Low ambient light
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.5);
        directionalLight.position.set(5, 3, 5); // Sun position
        scene.add(directionalLight);

        // ==========================================
        // GLOBE & ASSETS LOADING
        // ==========================================
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        let dayTexture, nightTexture, bumpTexture;
        let isDay = true;
        let earthMesh;
        const markerMeshes = [];

        const textureLoader = new THREE.TextureLoader();

        Promise.all([
            textureLoader.loadAsync(DAY_TEXTURE_URL),
            textureLoader.loadAsync(NIGHT_TEXTURE_URL),
            textureLoader.loadAsync(BUMP_TEXTURE_URL)
        ]).then(([dayT, nightT, bumpT]) => {
            dayTexture = dayT;
            nightTexture = nightT;
            bumpTexture = bumpT;
            
            dayTexture.colorSpace = THREE.SRGBColorSpace;
            nightTexture.colorSpace = THREE.SRGBColorSpace;
            
            loading.style.display = 'none';
            initGlobe();
            createStars();
        }).catch(err => {
            console.error("Error loading textures:", err);
            loading.innerHTML = "Error loading textures. Check console.";
            loading.style.color = "red";
        });

        function initGlobe() {
            // 1. Base Earth Mesh
            const earthGeometry = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
            const earthMaterial = new THREE.MeshStandardMaterial({
                map: dayTexture,
                bumpMap: bumpTexture,
                bumpScale: 0.015,
                roughness: 0.7,
                metalness: 0.1
            });
            earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
            earthGroup.add(earthMesh);

            // 2. Atmosphere Shader (Glow Effect)
            const atmosphereVertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;
            const atmosphereFragmentShader = `
                varying vec3 vNormal;
                void main() {
                    // Calculate intensity based on angle to camera (edges are brighter)
                    float intensity = pow(0.65 - dot(vNormal, vec3(0, 0, 1.0)), 4.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `;
            
            const atmosphereGeometry = new THREE.SphereGeometry(EARTH_RADIUS * 1.15, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: atmosphereVertexShader,
                fragmentShader: atmosphereFragmentShader,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true,
                depthWrite: false
            });
            const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            scene.add(atmosphereMesh); // Add to scene, not earthGroup, so glow stays relative to camera

            // 3. Add City Markers
            addMarkers();
        }

        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsCount = 2000;
            const posArray = new Float32Array(starsCount * 3);
            
            for(let i = 0; i < starsCount * 3; i++) {
                // Spread stars in a large sphere around the earth
                posArray[i] = (Math.random() - 0.5) * 50; 
            }
            
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starsMaterial = new THREE.PointsMaterial({
                size: 0.02,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                sizeAttenuation: true
            });
            const starMesh = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starMesh);
        }

        // ==========================================
        // MARKERS (RAYCASTING & LAT/LON)
        // ==========================================
        const cities = [
            { name: "New York, USA", lat: 40.7128, lon: -74.0060 },
            { name: "London, UK", lat: 51.5074, lon: -0.1278 },
            { name: "Tokyo, Japan", lat: 35.6762, lon: 139.6503 },
            { name: "Sydney, Australia", lat: -33.8688, lon: 151.2093 },
            { name: "Dubai, UAE", lat: 25.2048, lon: 55.2708 }
        ];

        function latLongToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        function addMarkers() {
            const markerGeo = new THREE.SphereGeometry(0.018, 16, 16);
            
            cities.forEach(city => {
                const markerMat = new THREE.MeshBasicMaterial({ color: 0xff3333 });
                const mesh = new THREE.Mesh(markerGeo, markerMat);
                // Position slightly above earth surface
                const pos = latLongToVector3(city.lat, city.lon, EARTH_RADIUS * 1.01);
                mesh.position.copy(pos);
                mesh.userData = { name: city.name, isMarker: true };
                earthGroup.add(mesh);
                markerMeshes.push(mesh);
            });
        }

        // ==========================================
        // INTERACTIONS (HOVER / TOUCH / TOGGLE)
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-2, -2); // init out of screen
        let isHovering = false;
        let hoveredMarker = null;

        function updateMousePos(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            // Adjust tooltip position offset
            tooltip.style.left = (clientX) + 'px';
            tooltip.style.top = (clientY - 15) + 'px';
        }

        // Mouse Events
        window.addEventListener('mousemove', (e) => {
            updateMousePos(e.clientX, e.clientY);
        });

        // Touch Events (Mobile)
        window.addEventListener('touchstart', (e) => {
            if(e.touches.length > 0) updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: true});
        
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) updateMousePos(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: true});

        window.addEventListener('touchend', () => {
            // Move mouse out of screen on touch end to hide tooltip
            mouse.x = -2;
            mouse.y = -2;
            tooltip.style.display = 'none';
            if(hoveredMarker) hoveredMarker.material.color.setHex(0xff3333);
            hoveredMarker = null;
            isHovering = false;
        });

        // Day/Night Toggle Button
        document.getElementById('toggleBtn').addEventListener('click', () => {
            isDay = !isDay;
            if(earthMesh) {
                earthMesh.material.map = isDay ? dayTexture : nightTexture;
                earthMesh.material.needsUpdate = true;
                
                // Adjust ambient lighting to make night texture pop
                ambientLight.intensity = isDay ? 0.2 : 0.6;
                directionalLight.intensity = isDay ? 2.5 : 0.3;
            }
        });

        // Window Resize Handle
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==========================================
        // ANIMATION LOOP
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // 1. Update Raycaster
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(markerMeshes);

            if (intersects.length > 0) {
                isHovering = true;
                const object = intersects[0].object;
                
                if (hoveredMarker !== object) {
                    if(hoveredMarker) hoveredMarker.material.color.setHex(0xff3333); // Reset old marker
                    hoveredMarker = object;
                    hoveredMarker.material.color.setHex(0xffff00); // Highlight new marker
                    tooltip.innerText = hoveredMarker.userData.name;
                    tooltip.style.display = 'block';
                    document.body.style.cursor = 'pointer';
                }
            } else {
                isHovering = false;
                if(hoveredMarker) {
                    hoveredMarker.material.color.setHex(0xff3333);
                    hoveredMarker = null;
                    tooltip.style.display = 'none';
                    document.body.style.cursor = 'default';
                }
            }

            // 2. Auto Rotation
            // Only rotate if not dragging and not hovering over a marker
            if (!isDragging && !isHovering) {
                earthGroup.rotation.y += 0.001;
            }

            // 3. Update Controls & Render
            controls.update(); // needed for damping
            renderer.render(scene, camera);
        }

        // Start animation loop
        animate();
    </script>
</body>
</html>
