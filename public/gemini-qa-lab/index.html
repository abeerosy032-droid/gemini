<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر تقييم Gemini - أسئلة وإجابات</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); }
        .gemini-gradient { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .gemini-text { color: #10b981; }
        .gemini-border { border-color: #10b981; }
        .qa-card { transition: all 0.3s ease; }
        .qa-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); }
        pre { background: #1e293b !important; border: 1px solid #334155; border-radius: 0.5rem; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row items-center justify-between shadow-xl">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-16 h-16 rounded-full gemini-gradient flex items-center justify-center text-white text-3xl shadow-lg">
                    <i class="fa-solid fa-gem"></i>
                </div>
                <div>
                    <h1 class="text-3xl font-bold text-white">مختبر تقييم <span class="gemini-text">Gemini</span></h1>
                    <p class="text-slate-400 mt-1">جلسة أسئلة وإجابات مباشرة</p>
                </div>
            </div>
            <div class="flex gap-3">
                <div class="bg-slate-800 rounded-lg p-3 text-center min-w-[100px] border border-slate-700">
                    <span class="block text-slate-400 text-xs mb-1">الأسئلة المجابة</span>
                    <span class="block text-2xl font-bold text-white" id="qa-count">0</span>
                </div>
                <a href="/" class="bg-slate-800 hover:bg-slate-700 text-white rounded-lg p-3 flex items-center gap-2 transition-colors border border-slate-700">
                    <i class="fas fa-home"></i> الرئيسية
                </a>
            </div>
        </header>

        <!-- Q&A Container -->
        <div id="qa-container" class="space-y-6">
            <!-- Loading state -->
            <div class="text-center py-12 text-slate-400" id="loading-state">
                <i class="fas fa-circle-notch fa-spin text-4xl gemini-text mb-4"></i>
                <p>في انتظار الأسئلة...</p>
            </div>
        </div>
    </div>

    <!-- Script to fetch and render data -->
    <script>
        const DATA_URL = './data.json';
        let previousDataString = '';

        // Function to render a single Q&A card
        function createQACard(item, index) {
            return `
                <div class="glass-panel rounded-xl p-6 qa-card border-l-4 gemini-border shadow-lg">
                    <div class="flex justify-between items-start mb-4 border-b border-slate-700 pb-4">
                        <h3 class="text-xl font-bold text-white flex items-center gap-2">
                            <span class="bg-slate-800 text-slate-300 w-8 h-8 rounded-full flex items-center justify-center text-sm">${index + 1}</span>
                            سؤال:
                        </h3>
                        <span class="text-xs text-slate-500 bg-slate-800 px-2 py-1 rounded">${item.timestamp || 'الآن'}</span>
                    </div>
                    
                    <div class="mb-6 bg-slate-800/50 p-4 rounded-lg border border-slate-700/50 text-slate-200">
                        ${formatContent(item.question)}
                    </div>
                    
                    <h3 class="text-lg font-bold gemini-text mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-robot"></i> إجابة Gemini:
                    </h3>
                    
                    <div class="prose prose-invert max-w-none text-slate-300">
                        ${formatContent(item.answer)}
                    </div>
                </div>
            `;
        }

        // Simple markdown formatter
        function formatContent(text) {
            if (!text) return '';
            
            // Format code blocks
            text = text.replace(/\`\`\`([\s\S]*?)\`\`\`/g, '<pre class="p-4 overflow-x-auto my-4 text-sm text-slate-300"><code>$1</code></pre>');
            
            // Format inline code
            text = text.replace(/\`([^\`]+)\`/g, '<code class="bg-slate-800 text-emerald-400 px-1 py-0.5 rounded text-sm">$1</code>');
            
            // Format bold
            text = text.replace(/\*\*([^\*]+)\*\*/g, '<strong class="text-white">$1</strong>');
            
            // Format line breaks
            text = text.replace(/\n/g, '<br>');
            
            return text;
        }

        // Fetch and update data
        async function fetchData() {
            try {
                // Use a cache-busting parameter to ensure we get the latest data
                const response = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
                const data = await response.json();
                
                // Only update DOM if data has changed
                const currentDataString = JSON.stringify(data);
                if (currentDataString !== previousDataString) {
                    previousDataString = currentDataString;
                    
                    const container = document.getElementById('qa-container');
                    const countEl = document.getElementById('qa-count');
                    
                    if (data.length === 0) {
                        container.innerHTML = `
                            <div class="text-center py-12 text-slate-400 bg-slate-800/50 rounded-xl border border-slate-700/50">
                                <i class="fas fa-comment-dots text-4xl text-slate-500 mb-4"></i>
                                <p>لا توجد أسئلة مسجلة حتى الآن. في انتظار السؤال الأول...</p>
                            </div>
                        `;
                        countEl.textContent = '0';
                    } else {
                        // Sort so newest is first (assuming push appends to end)
                        const reversedData = [...data].reverse();
                        container.innerHTML = reversedData.map((item, index) => 
                            createQACard(item, data.length - 1 - index)
                        ).join('');
                        
                        countEl.textContent = data.length;
                    }
                }
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        // Poll for updates every 3 seconds
        setInterval(fetchData, 3000);
        
        // Initial fetch
        fetchData();
    </script>
</body>
</html>
