<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشروع 14: لوحة إنفوجرافيك SVG تفاعلية</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #e2e8f0; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--panel); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #10b981; margin-bottom: 30px; }
        h2 { font-size: 1.1rem; margin-top: 0; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        svg { width: 100%; height: auto; display: block; overflow: visible; }
        
        /* Tooltip */
        #tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 1000;
            font-size: 14px;
            white-space: nowrap;
            border: 1px solid #334155;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
        }

        /* Donut Chart */
        .donut-segment { transition: stroke-width 0.2s, opacity 0.3s; cursor: pointer; }
        .donut-segment:hover { stroke-width: 25; }
        .donut-segment.hidden { opacity: 0.1; }
        @keyframes drawDonut { from { stroke-dasharray: 0 315; } }
        .donut-segment { animation: drawDonut 1.5s ease-out forwards; }

        /* Bar Chart */
        .bar { transform-box: fill-box; transform-origin: bottom; cursor: pointer; transition: opacity 0.3s, fill 0.2s; }
        .bar:hover { fill: #34d399; }
        @keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
        .bar { animation: growBar 1s ease-out forwards; }

        /* Line Chart */
        .line-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawLine 2s ease-out forwards; }
        @keyframes drawLine { to { stroke-dashoffset: 0; } }
        .area-path { opacity: 0; animation: fadeIn 1s 1s forwards; }
        @keyframes fadeIn { to { opacity: 0.2; } }
        .data-point { cursor: pointer; transition: r 0.2s; }
        .data-point:hover { r: 6; }

        /* Map */
        .map-region { stroke: var(--panel); stroke-width: 2; transition: fill 0.3s, filter 0.3s; cursor: pointer; }
        .map-region:hover { filter: brightness(1.3); }

        /* Legend */
        .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; transition: opacity 0.3s; }
        .legend-color { width: 14px; height: 14px; border-radius: 4px; }
        .legend-item.disabled { opacity: 0.4; text-decoration: line-through; }
    </style>
</head>
<body>
    <h1>المشروع 14: لوحة إنفوجرافيك SVG تفاعلية</h1>
    <div id="tooltip"></div>
    <div class="grid">
        <!-- Donut Chart -->
        <div class="card">
            <h2>توزيع الميزانية</h2>
            <svg viewBox="0 0 200 200" aria-labelledby="donutTitle donutDesc" role="img">
                <title id="donutTitle">Donut Chart</title>
                <desc id="donutDesc">رسم بياني دائري يوضح توزيع الميزانية عبر 5 فئات</desc>
                <g id="donut-group" transform="translate(100, 100) rotate(-90)"></g>
            </svg>
            <div class="legend" id="donut-legend"></div>
        </div>

        <!-- Bar Chart -->
        <div class="card">
            <h2>مقارنة الأرقام الشهرية</h2>
            <svg viewBox="0 0 400 200" aria-labelledby="barTitle barDesc" role="img">
                <title id="barTitle">Bar Chart</title>
                <desc id="barDesc">أعمدة تقارن الأرقام والمبيعات عبر الأشهر</desc>
                <line x1="40" y1="160" x2="380" y2="160" stroke="#475569" stroke-width="2"/>
                <line x1="40" y1="20" x2="40" y2="160" stroke="#475569" stroke-width="2"/>
                <g id="bar-group"></g>
            </svg>
        </div>

        <!-- Line Chart -->
        <div class="card">
            <h2>اتجاه النمو</h2>
            <svg viewBox="0 0 400 200" aria-labelledby="lineTitle lineDesc" role="img">
                <defs>
                    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#3b82f6" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <title id="lineTitle">Line Chart</title>
                <desc id="lineDesc">خط يوضح مسار النمو الإجمالي</desc>
                <line x1="40" y1="160" x2="380" y2="160" stroke="#475569" stroke-width="2"/>
                <line x1="40" y1="20" x2="40" y2="160" stroke="#475569" stroke-width="2"/>
                <g id="line-group"></g>
            </svg>
        </div>

        <!-- World Map -->
        <div class="card" style="grid-column: 1 / -1;">
            <h2>مبيعات الدول والمناطق</h2>
            <svg viewBox="0 0 800 400" aria-labelledby="mapTitle mapDesc" role="img">
                <title id="mapTitle">World Map</title>
                <desc id="mapDesc">خريطة تفاعلية توضح 5 مناطق دولية بناء على القيم</desc>
                <g id="map-group"></g>
            </svg>
        </div>
    </div>

    <script>
        const tooltip = document.getElementById('tooltip');

        // Tooltip logic with boundary checks
        document.addEventListener('mouseover', e => {
            const el = e.target.closest('[data-tooltip]');
            if (el) {
                tooltip.innerHTML = el.getAttribute('data-tooltip');
                tooltip.style.opacity = 1;
            }
        });
        document.addEventListener('mouseout', e => {
            if (e.target.closest('[data-tooltip]')) {
                tooltip.style.opacity = 0;
            }
        });
        document.addEventListener('mousemove', e => {
            if (tooltip.style.opacity == 1) {
                let left = e.pageX + 15;
                let top = e.pageY + 15;
                const rect = tooltip.getBoundingClientRect();
                
                // Prevent tooltip from overflowing the viewport
                if (left + rect.width > window.innerWidth) left = e.pageX - rect.width - 15;
                if (top + rect.height > window.innerHeight) top = e.pageY - rect.height - 15;
                
                tooltip.style.left = left + 'px';
                tooltip.style.top = top + 'px';
            }
        });

        // 1. Donut Chart (Math & Dasharray calculations)
        const donutData = [
            { id: 'cat1', label: 'الرواتب', value: 35, color: '#ef4444' },
            { id: 'cat2', label: 'التسويق', value: 25, color: '#f59e0b' },
            { id: 'cat3', label: 'التطوير', value: 20, color: '#10b981' },
            { id: 'cat4', label: 'الخوادم', value: 15, color: '#3b82f6' },
            { id: 'cat5', label: 'أخرى', value: 5, color: '#8b5cf6' }
        ];
        
        const donutGroup = document.getElementById('donut-group');
        const donutLegend = document.getElementById('donut-legend');
        const r = 40;
        const circ = 2 * Math.PI * r;
        let offset = 0;

        donutData.forEach(d => {
            const dash = (d.value / 100) * circ;
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', 0); circle.setAttribute('cy', 0);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', 'transparent');
            circle.setAttribute('stroke', d.color);
            circle.setAttribute('stroke-width', 20);
            circle.setAttribute('stroke-dasharray', `${dash} ${circ}`);
            circle.setAttribute('stroke-dashoffset', -offset);
            circle.setAttribute('data-tooltip', `<b>${d.label}</b>: ${d.value}%`);
            circle.classList.add('donut-segment');
            
            // Allow CSS animation to take over
            circle.style.strokeDasharray = `${dash} ${circ}`;
            
            donutGroup.appendChild(circle);
            offset += dash;

            // Interactive Legend
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `<div class="legend-color" style="background:${d.color}"></div><span>${d.label}</span>`;
            item.onclick = () => {
                item.classList.toggle('disabled');
                circle.classList.toggle('hidden');
            };
            donutLegend.appendChild(item);
        });

        // 2. Bar Chart (Animation on entry)
        const barData = [
            { label: 'يناير', value: 40 }, { label: 'فبراير', value: 65 },
            { label: 'مارس', value: 85 }, { label: 'أبريل', value: 50 }, { label: 'مايو', value: 95 }
        ];
        const barGroup = document.getElementById('bar-group');
        const barMax = Math.max(...barData.map(d => d.value));
        const chartH = 140; const barW = 40; const gap = (340 - (5*barW)) / 6;

        barData.forEach((d, i) => {
            const h = (d.value / barMax) * chartH;
            const x = 40 + gap + i * (barW + gap);
            const y = 160 - h;

            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x); rect.setAttribute('y', y);
            rect.setAttribute('width', barW); rect.setAttribute('height', h);
            rect.setAttribute('fill', '#6366f1'); rect.setAttribute('rx', 4);
            rect.classList.add('bar');
            rect.setAttribute('data-tooltip', `${d.label}: ${d.value}`);
            barGroup.appendChild(rect);

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', x + barW/2); text.setAttribute('y', 178);
            text.setAttribute('fill', '#94a3b8'); text.setAttribute('font-size', '12'); text.setAttribute('text-anchor', 'middle');
            text.textContent = d.label;
            barGroup.appendChild(text);
        });

        // 3. Line Chart (Path animation and gradient)
        const lineData = [20, 35, 55, 45, 80, 70, 110];
        const lineGroup = document.getElementById('line-group');
        const lineMax = Math.max(...lineData);
        let pathD = 'M '; let areaD = 'M 40 160 L ';
        const stepX = 340 / (lineData.length - 1);

        lineData.forEach((d, i) => {
            const x = 40 + i * stepX;
            const y = 160 - (d / lineMax) * 130;
            pathD += `${x} ${y} ${i < lineData.length - 1 ? 'L ' : ''}`;
            areaD += `${x} ${y} `;
            
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', x); circle.setAttribute('cy', y);
            circle.setAttribute('r', 4); circle.setAttribute('fill', '#fff');
            circle.setAttribute('stroke', '#3b82f6'); circle.setAttribute('stroke-width', 2);
            circle.classList.add('data-point');
            circle.setAttribute('data-tooltip', `القيمة: ${d}`);
            setTimeout(() => lineGroup.appendChild(circle), 1800);
        });

        areaD += `L ${40 + (lineData.length - 1) * stepX} 160 Z`;
        
        const areaPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        areaPath.setAttribute('d', areaD); areaPath.setAttribute('fill', 'url(#lineGrad)'); areaPath.classList.add('area-path');
        lineGroup.appendChild(areaPath);

        const linePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        linePath.setAttribute('d', pathD); linePath.setAttribute('fill', 'none'); linePath.setAttribute('stroke', '#3b82f6');
        linePath.setAttribute('stroke-width', 3); linePath.classList.add('line-path');
        lineGroup.appendChild(linePath);

        // 4. World Map SVG representation
        const mapGroup = document.getElementById('map-group');
        const mapData = [
            { name: 'أمريكا الشمالية', d: 'M100,80 Q200,30 250,100 T180,200 Q120,180 100,80', val: 850, color: '#3b82f6' },
            { name: 'أمريكا الجنوبية', d: 'M220,220 Q300,180 320,280 T260,380 Q200,300 220,220', val: 320, color: '#10b981' },
            { name: 'أوروبا', d: 'M380,60 Q450,20 500,80 T460,140 Q400,120 380,60', val: 640, color: '#f59e0b' },
            { name: 'آسيا', d: 'M520,70 Q650,40 750,150 T600,250 Q500,200 520,70', val: 980, color: '#ef4444' },
            { name: 'أفريقيا', d: 'M400,160 Q480,150 520,250 T450,350 Q380,280 400,160', val: 210, color: '#8b5cf6' }
        ];

        // Map background details
        for(let i=20; i<800; i+=40) {
            for(let j=20; j<400; j+=40) {
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', i); dot.setAttribute('cy', j);
                dot.setAttribute('r', 1); dot.setAttribute('fill', '#334155');
                mapGroup.appendChild(dot);
            }
        }

        mapData.forEach(region => {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', region.d); path.setAttribute('fill', region.color);
            path.setAttribute('opacity', 0.85); path.classList.add('map-region');
            path.setAttribute('data-tooltip', `<b>${region.name}</b><br>المبيعات: $${region.val}K`);
            mapGroup.appendChild(path);
        });
    </script>
</body>
</html>
