<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="weather-clear">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ لوحة الطقس العالمية — GLM-5.1</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        :root { --transition: .5s ease; }
        
        /* Weather themes */
        [data-theme="weather-clear"] {
            --bg1: #1e3c72; --bg2: #2a5298; --bg3: #f7971e;
            --card-bg: rgba(255,255,255,.12); --card-border: rgba(255,255,255,.2);
            --text: #fff; --text2: rgba(255,255,255,.75); --text3: rgba(255,255,255,.5);
            --accent: #f7971e; --glass: rgba(255,255,255,.08);
        }
        [data-theme="weather-cloudy"] {
            --bg1: #2c3e50; --bg2: #4ca1af; --bg3: #606c88;
            --card-bg: rgba(255,255,255,.1); --card-border: rgba(255,255,255,.15);
            --text: #fff; --text2: rgba(255,255,255,.7); --text3: rgba(255,255,255,.45);
            --accent: #4ca1af; --glass: rgba(255,255,255,.06);
        }
        [data-theme="weather-rain"] {
            --bg1: #0f2027; --bg2: #203a43; --bg3: #2c5364;
            --card-bg: rgba(255,255,255,.08); --card-border: rgba(255,255,255,.12);
            --text: #e0e0e0; --text2: rgba(255,255,255,.6); --text3: rgba(255,255,255,.35);
            --accent: #4fc3f7; --glass: rgba(255,255,255,.05);
        }
        [data-theme="weather-snow"] {
            --bg1: #e6dada; --bg2: #274046; --bg3: #e0eafc;
            --card-bg: rgba(255,255,255,.15); --card-border: rgba(255,255,255,.25);
            --text: #1a1a2e; --text2: rgba(0,0,0,.55); --text3: rgba(0,0,0,.35);
            --accent: #2196f3; --glass: rgba(255,255,255,.2);
        }
        [data-theme="weather-night"] {
            --bg1: #0a0a1a; --bg2: #1a1a3e; --bg3: #0d0d2b;
            --card-bg: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.1);
            --text: #c0c0e0; --text2: rgba(200,200,255,.5); --text3: rgba(200,200,255,.3);
            --accent: #7c4dff; --glass: rgba(255,255,255,.04);
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI','Tajawal',Tahoma,sans-serif;
            min-height:100vh; color:var(--text);
            background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
            transition: background var(--transition);
        }

        .app { max-width:860px; margin:0 auto; padding:20px; }

        /* Header */
        .header { text-align:center; padding:30px 0 20px; }
        .header h1 { font-size:28px; font-weight:700; margin-bottom:4px; }
        .header .sub { color:var(--text2); font-size:14px; }

        /* Search */
        .search-area { display:flex; gap:10px; margin:20px 0; max-width:500px; margin-left:auto; margin-right:auto; }
        .search-area input {
            flex:1; padding:14px 18px; border-radius:14px; border:1px solid var(--card-border);
            background:var(--card-bg); color:var(--text); font-size:15px; outline:none;
            backdrop-filter:blur(10px); transition:border-color .2s;
        }
        .search-area input::placeholder { color:var(--text3); }
        .search-area input:focus { border-color:var(--accent); }
        .search-area button {
            padding:14px 20px; border-radius:14px; border:none; background:var(--accent);
            color:#fff; font-size:16px; cursor:pointer; transition:opacity .2s;
        }
        .search-area button:hover { opacity:.85; }

        /* Recent cities */
        .recent { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
        .recent-chip {
            padding:6px 14px; border-radius:20px; background:var(--glass);
            border:1px solid var(--card-border); color:var(--text2);
            font-size:13px; cursor:pointer; transition:all .2s; backdrop-filter:blur(5px);
        }
        .recent-chip:hover { background:var(--card-bg); color:var(--text); border-color:var(--accent); }

        /* Unit toggle */
        .unit-toggle {
            display:flex; justify-content:center; gap:0; margin-bottom:24px;
        }
        .unit-btn {
            padding:8px 20px; border:1px solid var(--card-border); background:var(--glass);
            color:var(--text2); cursor:pointer; font-size:14px; font-weight:600; transition:all .2s;
        }
        .unit-btn:first-child { border-radius:10px 0 0 10px; }
        .unit-btn:last-child { border-radius:0 10px 10px 0; }
        .unit-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

        /* Current weather */
        .current {
            background:var(--card-bg); border:1px solid var(--card-border);
            border-radius:20px; padding:30px; margin-bottom:20px;
            backdrop-filter:blur(15px); text-align:center;
        }
        .current .city { font-size:22px; font-weight:700; margin-bottom:4px; }
        .current .date { font-size:13px; color:var(--text2); margin-bottom:20px; }
        .current .main-row { display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:20px; }
        .current .weather-icon { font-size:72px; }
        .current .temp { font-size:64px; font-weight:700; line-height:1; }
        .current .temp .unit { font-size:28px; font-weight:400; color:var(--text2); }
        .current .desc { font-size:18px; color:var(--text2); margin-bottom:20px; }
        .current .details { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; }
        .current .detail { text-align:center; }
        .current .detail .val { font-size:20px; font-weight:600; }
        .current .detail .lbl { font-size:12px; color:var(--text3); margin-top:2px; }
        .current .coord { font-size:11px; color:var(--text3); margin-top:16px; }

        /* Forecast */
        .forecast-title { font-size:18px; font-weight:600; margin:24px 0 12px; }
        .forecast { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:24px; }
        .forecast-card {
            background:var(--card-bg); border:1px solid var(--card-border);
            border-radius:16px; padding:16px 10px; text-align:center;
            backdrop-filter:blur(10px); transition:all .2s;
        }
        .forecast-card:hover { border-color:var(--accent); transform:translateY(-3px); }
        .forecast-card .day { font-size:13px; font-weight:600; margin-bottom:8px; }
        .forecast-card .f-icon { font-size:36px; margin-bottom:8px; }
        .forecast-card .f-temps { font-size:14px; }
        .forecast-card .f-high { font-weight:700; }
        .forecast-card .f-low { color:var(--text3); font-size:13px; }

        /* Chart */
        .chart-container {
            background:var(--card-bg); border:1px solid var(--card-border);
            border-radius:20px; padding:20px; margin-bottom:20px;
            backdrop-filter:blur(15px);
        }
        .chart-title { font-size:16px; font-weight:600; margin-bottom:12px; }
        .chart-wrap { position:relative; height:220px; }

        /* Error / Loading */
        .loading { text-align:center; padding:50px 20px; }
        .spinner { display:inline-block; width:36px; height:36px; border:3px solid var(--card-border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .error-box {
            background:rgba(244,67,54,.15); border:1px solid rgba(244,67,54,.3);
            border-radius:14px; padding:20px; text-align:center; margin:20px 0;
        }
        .error-box .icon { font-size:36px; margin-bottom:8px; }
        .error-box .msg { font-size:14px; }

        /* Empty state */
        .empty { text-align:center; padding:60px 20px; }
        .empty .icon { font-size:60px; margin-bottom:12px; }
        .empty p { font-size:16px; margin-bottom:4px; }
        .empty small { font-size:13px; color:var(--text3); }

        .footer { text-align:center; padding:20px; color:var(--text3); font-size:12px; }

        /* Responsive */
        @media (max-width:600px) {
            .forecast { grid-template-columns:repeat(3,1fr); }
            .current .temp { font-size:48px; }
            .current .weather-icon { font-size:52px; }
            .current .details { gap:16px; }
            .app { padding:12px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>🌤️ لوحة الطقس العالمية</h1>
            <div class="sub">GLM-5.1 Evaluation — بيانات حية من Open-Meteo API</div>
        </div>

        <!-- Search -->
        <form class="search-area" onsubmit="searchCity(event)">
            <input type="text" id="cityInput" placeholder="🔍 ابحث عن مدينة..." autocomplete="off" required>
            <button type="button" onclick="detectLocation()" title="موقعي الحالي">📍</button>
            <button type="submit">بحث</button>
        </form>

        <!-- Recent cities -->
        <div class="recent" id="recentCities"></div>

        <!-- Unit toggle -->
        <div class="unit-toggle">
            <button class="unit-btn active" onclick="setUnit('C')">°C</button>
            <button class="unit-btn" onclick="setUnit('F')">°F</button>
        </div>

        <!-- Weather content -->
        <div id="weatherContent">
            <div class="empty">
                <div class="icon">🌍</div>
                <p>ابحث عن مدينة أو اضغط 📍 لموقعك</p>
                <small>بيانات حية من Open-Meteo — لا يحتاج مفتاح API</small>
            </div>
        </div>

        <div class="footer">GLM-5.1 Project 6 — Weather Dashboard | Open-Meteo API | Vanilla JS + Chart.js</div>
    </div>

<script>
// ============================
// MODULE: storage.js — Recent cities in localStorage
// ============================
const Storage = {
    KEY: 'glm5_recent_cities',
    MAX: 5,

    get() {
        try { return JSON.parse(localStorage.getItem(this.KEY)) || []; }
        catch { return []; }
    },

    add(city) {
        let cities = this.get();
        cities = cities.filter(c => c.name !== city.name);
        cities.unshift(city);
        if (cities.length > this.MAX) cities = cities.slice(0, this.MAX);
        localStorage.setItem(this.KEY, JSON.stringify(cities));
        this.render();
    },

    render() {
        const el = document.getElementById('recentCities');
        const cities = this.get();
        if (!cities.length) { el.innerHTML = ''; return; }
        el.innerHTML = '<span style="font-size:12px;color:var(--text3)">آخر المدن:</span>' +
            cities.map(c => `<span class="recent-chip" onclick="loadCity(${c.lat},${c.lon},'${escAttr(c.name)}')">${c.name}</span>`).join('');
    }
};

// ============================
// MODULE: api.js — Open-Meteo API calls
// ============================
const Api = {
    GEO_URL: 'https://geocoding-api.open-meteo.com/v1/search',
    WEATHER_URL: 'https://api.open-meteo.com/v1/forecast',

    async geocode(city) {
        const res = await fetch(`${this.GEO_URL}?name=${encodeURIComponent(city)}&count=1&language=ar`);
        if (!res.ok) throw new Error('NETWORK');
        const data = await res.json();
        if (!data.results || !data.results.length) throw new Error('NOT_FOUND');
        const r = data.results[0];
        return { name: r.name, country: r.country || '', lat: r.latitude, lon: r.longitude };
    },

    async getWeather(lat, lon) {
        const params = new URLSearchParams({
            latitude: lat, longitude: lon,
            current: 'temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code,is_day',
            daily: 'weather_code,temperature_2m_max,temperature_2m_min',
            hourly: 'temperature_2m',
            timezone: 'auto',
            forecast_days: 5,
        });
        const res = await fetch(`${this.WEATHER_URL}?${params}`);
        if (!res.ok) throw new Error('NETWORK');
        return await res.json();
    }
};

// ============================
// MODULE: ui.js — Weather code mapping & rendering
// ============================
const WMO = {
    0:  { desc:'صافٍ', icon:'☀️', theme:'clear', night:'🌙', nightTheme:'night' },
    1:  { desc:'غالباً صافٍ', icon:'🌤️', theme:'clear', night:'🌙', nightTheme:'night' },
    2:  { desc:'غائم جزئياً', icon:'⛅', theme:'cloudy', night:'☁️', nightTheme:'night' },
    3:  { desc:'غائم', icon:'☁️', theme:'cloudy', night:'☁️', nightTheme:'night' },
    45:{ desc:'ضبابي', icon:'🌫️', theme:'cloudy', night:'🌫️', nightTheme:'night' },
    48:{ desc:'ضباب متجمد', icon:'🌫️', theme:'cloudy', night:'🌫️', nightTheme:'night' },
    51:{ desc:'رذاذ خفيف', icon:'🌦️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    53:{ desc:'رذاذ متوسط', icon:'🌦️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    55:{ desc:'رذاذ كثيف', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    56:{ desc:'رذاذ متجمد', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    57:{ desc:'رذاذ متجمد كثيف', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    61:{ desc:'مطر خفيف', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    63:{ desc:'مطر متوسط', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    65:{ desc:'مطر غزير', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    66:{ desc:'مطر متجمد', icon:'🧊', theme:'rain', night:'🧊', nightTheme:'rain' },
    67:{ desc:'مطر متجمد غزير', icon:'🧊', theme:'rain', night:'🧊', nightTheme:'rain' },
    71:{ desc:'ثلج خفيف', icon:'🌨️', theme:'snow', night:'🌨️', nightTheme:'night' },
    73:{ desc:'ثلج متوسط', icon:'❄️', theme:'snow', night:'❄️', nightTheme:'night' },
    75:{ desc:'ثلج كثيف', icon:'❄️', theme:'snow', night:'❄️', nightTheme:'night' },
    77:{ desc:'حبيبات ثلجية', icon:'🌨️', theme:'snow', night:'🌨️', nightTheme:'night' },
    80:{ desc:'زخات مطر خفيفة', icon:'🌦️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    81:{ desc:'زخات مطر متوسطة', icon:'🌧️', theme:'rain', night:'🌧️', nightTheme:'rain' },
    82:{ desc:'زخات مطر عنيفة', icon:'⛈️', theme:'rain', night:'⛈️', nightTheme:'rain' },
    85:{ desc:'زخات ثلج خفيفة', icon:'🌨️', theme:'snow', night:'🌨️', nightTheme:'night' },
    86:{ desc:'زخات ثلج كثيفة', icon:'❄️', theme:'snow', night:'❄️', nightTheme:'night' },
    95:{ desc:'عاصفة رعدية', icon:'⛈️', theme:'rain', night:'⛈️', nightTheme:'rain' },
    96:{ desc:'عاصفة مع برد', icon:'⛈️', theme:'rain', night:'⛈️', nightTheme:'rain' },
    99:{ desc:'عاصفة مع برد كبير', icon:'⛈️', theme:'rain', night:'⛈️', nightTheme:'rain' },
};

function getWmo(code, isDay) {
    const w = WMO[code] || { desc:'غير معروف', icon:'🌡️', theme:'clear', night:'🌡️', nightTheme:'night' };
    if (isDay === 0) return { ...w, icon: w.night, theme: w.nightTheme };
    return w;
}

// ============================
// STATE
// ============================
let currentUnit = 'C'; // C or F
let currentWeatherData = null;
let currentCityName = '';
let hourlyChart = null;

// ============================
// ACTIONS
// ============================
async function searchCity(e) {
    e.preventDefault();
    const city = document.getElementById('cityInput').value.trim();
    if (!city) return;

    showLoading();
    try {
        const geo = await Api.geocode(city);
        currentCityName = geo.name + (geo.country ? `, ${geo.country}` : '');
        Storage.add({ name: currentCityName, lat: geo.lat, lon: geo.lon });
        await loadWeather(geo.lat, geo.lon, currentCityName);
    } catch (err) {
        showError(err.message);
    }
}

async function loadCity(lat, lon, name) {
    showLoading();
    try {
        await loadWeather(lat, lon, name);
    } catch (err) {
        showError(err.message);
    }
}

async function detectLocation() {
    if (!navigator.geolocation) {
        showError('GEO_UNSUPPORTED');
        return;
    }
    showLoading();
    navigator.geolocation.getCurrentPosition(
        async (pos) => {
            try {
                // Reverse geocode using Open-Meteo
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&count=1&language=ar`);
                const data = await res.json();
                let name = 'موقعك الحالي';
                if (data.results && data.results.length) {
                    name = data.results[0].name;
                    const country = data.results[0].country;
                    if (country) name += `, ${country}`;
                }
                Storage.add({ name, lat: pos.coords.latitude, lon: pos.coords.longitude });
                await loadWeather(pos.coords.latitude, pos.coords.longitude, name);
            } catch {
                await loadWeather(pos.coords.latitude, pos.coords.longitude, 'موقعك');
            }
        },
        (err) => {
            let msg = 'LOCATION_DENIED';
            if (err.code === 2) msg = 'LOCATION_UNAVAILABLE';
            if (err.code === 3) msg = 'LOCATION_TIMEOUT';
            showError(msg);
        },
        { enableHighAccuracy: false, timeout: 10000 }
    );
}

async function loadWeather(lat, lon, cityName) {
    try {
        const data = await Api.getWeather(lat, lon);
        currentWeatherData = data;
        currentCityName = cityName;
        renderWeather(data, cityName, lat, lon);
    } catch (err) {
        showError(err.message);
    }
}

// ============================
// RENDER
// ============================
function renderWeather(data, cityName, lat, lon) {
    const c = data.current;
    const d = data.daily;
    const h = data.hourly;
    const isDay = c.is_day;
    const wmo = getWmo(c.weather_code, isDay);

    // Set background theme
    document.documentElement.setAttribute('data-theme', `weather-${wmo.theme}`);

    const tempC = c.temperature_2m;
    const tempDisplay = convertTemp(tempC);
    const unitLabel = currentUnit === 'C' ? '°C' : '°F';

    // Hourly data: next 24h
    const now = new Date();
    const nowIdx = h.time.findIndex(t => new Date(t) >= now);
    const hourLabels = [];
    const hourTemps = [];
    const startIdx = Math.max(0, nowIdx !== -1 ? nowIdx : 0);
    for (let i = startIdx; i < startIdx + 24 && i < h.time.length; i++) {
        const dt = new Date(h.time[i]);
        hourLabels.push(dt.getHours().toString().padStart(2,'0') + ':00');
        hourTemps.push(convertTempRaw(h.temperature_2m[i]));
    }

    // Forecast cards
    const dayNames = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    let forecastHTML = '';
    for (let i = 0; i < d.time.length; i++) {
        const dt = new Date(d.time[i]);
        const dayName = i === 0 ? 'اليوم' : dayNames[dt.getDay()];
        const fw = getWmo(d.weather_code[i], 1);
        forecastHTML += `
            <div class="forecast-card">
                <div class="day">${dayName}</div>
                <div class="f-icon">${fw.icon}</div>
                <div class="f-temps">
                    <span class="f-high">${convertTemp(d.temperature_2m_max[i])}${unitLabel}</span><br>
                    <span class="f-low">${convertTemp(d.temperature_2m_min[i])}${unitLabel}</span>
                </div>
            </div>`;
    }

    const html = `
        <!-- Current -->
        <div class="current">
            <div class="city">${escHtml(cityName)}</div>
            <div class="date">${new Date().toLocaleDateString('ar', { weekday:'long', year:'numeric', month:'long', day:'numeric' })}</div>
            <div class="main-row">
                <div class="weather-icon">${wmo.icon}</div>
                <div class="temp">${tempDisplay}<span class="unit">${unitLabel}</span></div>
            </div>
            <div class="desc">${wmo.desc}</div>
            <div class="details">
                <div class="detail"><div class="val">💧 ${c.relative_humidity_2m}%</div><div class="lbl">الرطوبة</div></div>
                <div class="detail"><div class="val">💨 ${c.wind_speed_10m} km/h</div><div class="lbl">الرياح</div></div>
                <div class="detail"><div class="val">🌡️ ${convertTemp(d.temperature_2m_max[0])}° / ${convertTemp(d.temperature_2m_min[0])}°</div><div class="lbl">عظمى / صغرى</div></div>
            </div>
            <div class="coord">📍 ${lat.toFixed(4)}, ${lon.toFixed(4)}</div>
        </div>

        <!-- Forecast -->
        <div class="forecast-title">📅 توقع 5 أيام</div>
        <div class="forecast">${forecastHTML}</div>

        <!-- Chart -->
        <div class="chart-container">
            <div class="chart-title">📈 درجات الحرارة — 24 ساعة القادمة (${unitLabel})</div>
            <div class="chart-wrap"><canvas id="tempChart"></canvas></div>
        </div>
    `;

    document.getElementById('weatherContent').innerHTML = html;
    renderChart(hourLabels, hourTemps, unitLabel);
}

// ============================
// MODULE: charts.js — Chart.js line chart
// ============================
function renderChart(labels, temps, unit) {
    const ctx = document.getElementById('tempChart');
    if (!ctx) return;

    if (hourlyChart) hourlyChart.destroy();

    const isDark = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() !== '#1a1a2e';
    const gridColor = 'rgba(255,255,255,.08)';
    const textColor = 'rgba(255,255,255,.5)';

    hourlyChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label: `الحرارة (${unit})`,
                data: temps,
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#f7971e',
                backgroundColor: 'rgba(255,255,255,.05)',
                fill: true,
                tension: .4,
                pointRadius: 3,
                pointHoverRadius: 6,
                borderWidth: 2.5,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(0,0,0,.8)',
                    titleFont: { size: 12 },
                    bodyFont: { size: 13 },
                    padding: 10,
                    cornerRadius: 8,
                }
            },
            scales: {
                x: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } },
                y: { ticks: { color: textColor, font: { size: 11 } }, grid: { color: gridColor } }
            }
        }
    });
}

// ============================
// UNIT CONVERSION (instant, no re-fetch)
// ============================
function setUnit(u) {
    currentUnit = u;
    document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.unit-btn:${u === 'C' ? 'first-child' : 'last-child'}`).classList.add('active');
    if (currentWeatherData) {
        renderWeather(currentWeatherData, currentCityName, currentWeatherData.latitude || 0, currentWeatherData.longitude || 0);
    }
}

function convertTemp(celsius) {
    if (currentUnit === 'F') return ((celsius * 9/5) + 32).toFixed(1);
    return Math.round(celsius * 10) / 10;
}
function convertTempRaw(celsius) {
    if (currentUnit === 'F') return +((celsius * 9/5) + 32).toFixed(1);
    return celsius;
}

// ============================
// ERROR / LOADING
// ============================
function showLoading() {
    document.getElementById('weatherContent').innerHTML = `
        <div class="loading"><div class="spinner"></div><p style="margin-top:12px;color:var(--text2)">جاري تحميل بيانات الطقس...</p></div>`;
}

function showError(type) {
    const messages = {
        'NOT_FOUND': { icon:'🏙️', msg:'المدينة غير موجودة — تأكد من الاسم' },
        'NETWORK': { icon:'📡', msg:'خطأ في الاتصال — تحقق من الإنترنت' },
        'GEO_UNSUPPORTED': { icon:'📍', msg:'متصفحك لا يدعم تحديد الموقع' },
        'LOCATION_DENIED': { icon:'🚫', msg:'تم رفض إذن الموقع — ابحث يدوياً' },
        'LOCATION_UNAVAILABLE': { icon:'📍', msg:'لم يتم تحديد الموقع — ابحث يدوياً' },
        'LOCATION_TIMEOUT': { icon:'⏱️', msg:'انتهت مهلة تحديد الموقع — ابحث يدوياً' },
    };
    const e = messages[type] || { icon:'⚠️', msg:'حدث خطأ غير متوقع' };
    document.getElementById('weatherContent').innerHTML = `
        <div class="error-box"><div class="icon">${e.icon}</div><div class="msg">${e.msg}</div></div>`;
}

// ============================
// HELPERS
// ============================
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/'/g, "\\'"); }

// ============================
// INIT
// ============================
Storage.render();

// Try loading last searched city
const lastCities = Storage.get();
if (lastCities.length) {
    const last = lastCities[0];
    loadCity(last.lat, last.lon, last.name);
}
</script>
