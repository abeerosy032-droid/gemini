<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملفات المشروع 1 — GLM-5.1 Eval</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', monospace; background: #0d1117; color: #c9d1d9; min-height: 100vh; }
        .topbar { background: #161b22; padding: 12px 20px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 16px; }
        .topbar a { color: #58a6ff; text-decoration: none; font-size: 14px; }
        .topbar a:hover { text-decoration: underline; }
        .topbar .sep { color: #484f58; }
        .topbar .repo { color: #c9d1d9; font-weight: 600; }
        .container { display: flex; min-height: calc(100vh - 45px); }
        .sidebar { width: 280px; background: #161b22; border-left: 1px solid #30363d; padding: 16px 0; overflow-y: auto; }
        .sidebar .title { padding: 0 16px 12px; font-size: 12px; color: #484f58; text-transform: uppercase; letter-spacing: 1px; }
        .file-tree { list-style: none; }
        .file-tree li { padding: 6px 16px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 8px; color: #8b949e; }
        .file-tree li:hover { background: #1c2128; color: #c9d1d9; }
        .file-tree li.active { background: #1c2128; color: #58a6ff; }
        .file-tree li.folder { color: #79c0ff; font-weight: 500; }
        .file-tree li .icon { font-size: 14px; width: 18px; text-align: center; }
        .content { flex: 1; padding: 20px; overflow-y: auto; }
        .file-header { padding: 12px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px 8px 0 0; font-size: 13px; color: #8b949e; display: flex; align-items: center; gap: 8px; }
        .file-header .lang { background: #1f6feb33; color: #58a6ff; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .code-block { background: #161b22; border: 1px solid #30363d; border-top: none; border-radius: 0 0 8px 8px; padding: 16px; overflow-x: auto; font-family: 'Fira Code', 'Courier New', monospace; font-size: 13px; line-height: 1.6; white-space: pre; color: #c9d1d9; tab-size: 4; max-height: 70vh; }
        .empty { display: flex; align-items: center; justify-content: center; height: 60vh; color: #484f58; font-size: 16px; }
        .stats { padding: 12px 16px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 16px; display: flex; gap: 20px; flex-wrap: wrap; }
        .stats .item { font-size: 13px; color: #8b949e; }
        .stats .item strong { color: #58a6ff; }
        .line-num { color: #484f58; user-select: none; display: inline-block; width: 40px; text-align: left; margin-left: 16px; }
        /* Syntax highlighting */
        .kw { color: #ff7b72; } /* keywords */
        .fn { color: #d2a8ff; } /* functions */
        .str { color: #a5d6ff; } /* strings */
        .cm { color: #8b949e; font-style: italic; } /* comments */
        .var { color: #ffa657; } /* variables */
        .tag { color: #7ee787; } /* tags/annotations */
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/">📊 التقييم</a>
        <span class="sep">/</span>
        <span class="repo">📁 مشروع 1: منظومة المقالات</span>
    </div>

    <div class="stats" id="stats">
        <div class="item">📁 <strong id="fCount">0</strong> ملف</div>
        <div class="item">📝 <strong id="lCount">0</strong> سطر</div>
        <div class="item">📅 <strong>2026-05-07</strong></div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="title">ملفات المشروع</div>
            <ul class="file-tree" id="tree"></ul>
        </div>
        <div class="content" id="content">
            <div class="empty">اختر ملفاً من القائمة لعرض محتواه</div>
        </div>
    </div>

    <script>
const FILES = {};
let totalLines = 0;

async function loadFileList() {
    try {
        const res = await fetch('project6/FILE_INDEX.json');
        const index = await res.json();
        const tree = document.getElementById('tree');
        let fCount = 0;

        index.forEach(item => {
            if (item.type === 'dir') {
                const li = document.createElement('li');
                li.className = 'folder';
                li.innerHTML = `<span class="icon">📁</span> ${item.path}`;
                tree.appendChild(li);
            } else {
                fCount++;
                const li = document.createElement('li');
                li.dataset.path = item.path;
                li.innerHTML = `<span class="icon">${getIcon(item.path)}</span> ${item.name}`;
                li.onclick = () => showFile(item.path);
                tree.appendChild(li);
            }
        });

        document.getElementById('fCount').textContent = fCount;
    } catch(e) {
        document.getElementById('tree').innerHTML = '<li style="color:#f85149">فشل تحميل قائمة الملفات</li>';
    }
}

function getIcon(path) {
    if (path.endsWith('.php')) return '🐘';
    if (path.endsWith('.blade.php')) return '🖼️';
    if (path.endsWith('.md')) return '📄';
    return '📄';
}

function getLang(path) {
    if (path.endsWith('.blade.php')) return 'Blade';
    if (path.endsWith('.php')) return 'PHP';
    if (path.endsWith('.md')) return 'Markdown';
    return 'Text';
}

async function showFile(path) {
    document.querySelectorAll('.file-tree li').forEach(li => li.classList.remove('active'));
    const active = document.querySelector(`[data-path="${path}"]`);
    if (active) active.classList.add('active');

    const content = document.getElementById('content');
    content.innerHTML = '<div class="empty">⏳ جاري التحميل...</div>';

    try {
        const res = await fetch(`project6/${encodeURIComponent(path)}`);
        let text = await res.text();

        const lines = text.split('\n').length;
        totalLines = lines;

        const numbered = text.split('\n').map((line, i) =>
            `<span class="line-num">${i + 1}</span>${escapeHtml(line)}`
        ).join('\n');

        content.innerHTML = `
            <div class="file-header">
                📄 ${path.split('/').pop()}
                <span class="lang">${getLang(path)}</span>
                <span style="margin-right:auto">${lines} سطر</span>
            </div>
            <div class="code-block">${numbered}</div>
        `;
    } catch(e) {
        content.innerHTML = '<div class="empty">❌ فشل تحميل الملف</div>';
    }
}

function escapeHtml(text) {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadFileList();
    </script>
</body>
</html>
