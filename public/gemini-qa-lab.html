<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مختبر تقييم Gemini - قسم الأسئلة والأجوبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .message-q { background-color: #1e293b; border-right: 4px solid #10b981; }
        .message-a { background-color: #0f172a; border-right: 4px solid #3b82f6; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-emerald-400">مختبر تقييم Gemini (Q&A) 💎</h1>
        
        <div id="chat-container" class="space-y-6">
            <!-- سيتم جلب الأسئلة والأجوبة هنا -->
        </div>
    </div>

    <script>
        async function loadQA() {
            try {
                // إضافة timestamp لتجنب الكاش
                const response = await fetch('/gemini-qa-data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                const container = document.getElementById('chat-container');
                container.innerHTML = '';
                
                if (data.length === 0) {
                    container.innerHTML = '<div class="text-center text-slate-500 py-10">في انتظار الأسئلة...</div>';
                    return;
                }
                
                data.forEach(item => {
                    container.innerHTML += `
                        <div class="rounded-lg shadow-lg overflow-hidden border border-slate-700">
                            <div class="message-q p-6">
                                <span class="text-emerald-400 font-bold mb-2 block">السؤال:</span>
                                <div class="text-lg whitespace-pre-wrap">${item.question}</div>
                            </div>
                            <div class="message-a p-6 border-t border-slate-700">
                                <span class="text-blue-400 font-bold mb-2 block">إجابة Gemini:</span>
                                <div class="text-lg whitespace-pre-wrap text-slate-300 leading-relaxed">${item.answer}</div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        loadQA();
        // تحديث كل 3 ثواني
        setInterval(loadQA, 3000);
    </script>
</body>
</html>
