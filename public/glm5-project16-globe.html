<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشروع 16: كرة الأرض ثلاثية الأبعاد — GLM-5.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; margin: 0; overflow: hidden; }
        #globe-container { width: 100vw; height: 100vh; }
        .marker-label {
            position: absolute;
            background: rgba(10, 10, 26, 0.95);
            color: white;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            pointer-events: none;
            transform: translate(-50%, -120%);
            white-space: nowrap;
            z-index: 1000;
            border: 1px solid rgba(99, 102, 241, 0.6);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s ease;
        }
        .marker-label::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(10, 10, 26, 0.95);
        }
        .controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            z-index: 1000;
            max-width: 300px;
        }
        .toggle-btn {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            font-family: 'Tajawal', sans-serif;
        }
        .toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        .info-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            flex-direction: column;
            gap: 20px;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 3px solid rgba(99, 102, 241, 0.3);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* City list panel */
        .city-list {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 50px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            z-index: 1000;
            display: flex;
            gap: 16px;
            align-items: center;
        }
        .city-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #ff6b6b;
            display: inline-block;
            animation: pulse 2s infinite;
            box-shadow: 0 0 8px rgba(255, 107, 107, 0.6);
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
    </style>
</head>
<body class="bg-[#0a0a1a]">

    <!-- Loading Overlay -->
    <div id="loading" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="text-indigo-300 text-lg">جاري تحميل الكرة الأرضية...</p>
    </div>

    <!-- Globe Container -->
    <div id="globe-container"></div>

    <!-- Controls Panel -->
    <div class="controls-panel">
        <div class="flex items-center gap-3 mb-4">
            <span class="text-2xl">🌍</span>
            <div>
                <h3 class="text-lg font-bold text-indigo-300">كرة الأرض ثلاثية الأبعاد</h3>
                <p class="text-xs text-gray-500">المشروع 16 — GLM-5.1</p>
            </div>
        </div>

        <div class="space-y-3">
            <div class="flex items-center justify-between">
                <span class="text-sm text-gray-400">الوضع الحالي:</span>
                <span id="mode-badge" class="info-badge bg-yellow-500/20 text-yellow-400">نهاري ☀️</span>
            </div>

            <button id="toggle-mode" class="toggle-btn">
                🌙 التبديل إلى الوضع الليلي
            </button>

            <div class="pt-3 border-t border-white/10">
                <p class="text-xs text-gray-500 mb-2">المدن المُعلّمة:</p>
                <div class="flex flex-wrap gap-2" id="city-badges"></div>
            </div>

            <div class="pt-3 border-t border-white/10">
                <p class="text-xs text-gray-500 mb-2">تعليمات:</p>
                <ul class="text-xs text-gray-400 space-y-1">
                    <li>• اسحب للدوران</li>
                    <li>• مرّر للتكبير/التصغير</li>
                    <li>• مرّر فوق النقاط الحمراء لرؤية المدن</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Marker Label Container -->
    <div id="marker-labels"></div>

    <!-- Three.js -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ============================================
        // 🎨 TEXTURE CONFIGURATION - غيّر الروابط هنا لتبديل الخرائط
        // ============================================
        const TEXTURE_CONFIG = {
            // خريطة الأرض النهارية
            dayTexture: 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',
            // خريطة الأرض الليلية
            nightTexture: 'https://unpkg.com/three-globe/example/img/earth-night.jpg',
            // خريطة الطوبوغرافيا (ظلال وإضاءة)
            bumpTexture: 'https://unpkg.com/three-globe/example/img/earth-topology.png',
        };

        // ============================================
        // 🏙️ CITY MARKERS - غيّر أو أضف مدن هنا
        // ============================================
        const CITIES = [
            { name: 'الرياض',  lat: 24.7136, lon: 46.6753,  country: 'السعودية',          emoji: '🇸🇦' },
            { name: 'القاهرة', lat: 30.0444, lon: 31.2357,  country: 'مصر',               emoji: '🇪🇬' },
            { name: 'دبي',    lat: 25.2048, lon: 55.2708,  country: 'الإمارات',           emoji: '🇦🇪' },
            { name: 'لندن',   lat: 51.5074, lon: -0.1278,  country: 'المملكة المتحدة',    emoji: '🇬🇧' },
            { name: 'نيويورك', lat: 40.7128, lon: -74.0060, country: 'الولايات المتحدة',    emoji: '🇺🇸' },
        ];

        // ============================================
        // 🌍 GLOBALS
        // ============================================
        let scene, camera, renderer, controls;
        let earth, atmosphere, stars;
        let isNightMode = false;
        let hoveredCity = null;
        const markerMeshes = [];   // THREE.Mesh on the sphere surface
        const markerPositions = []; // Vector3 in local space

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2(-999, -999);  // off-screen default
        const HOVER_THRESHOLD = 0.12; // radians — hover detection radius on sphere

        // Build city badges in control panel
        const badgesEl = document.getElementById('city-badges');
        CITIES.forEach(c => {
            const span = document.createElement('span');
            span.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs bg-white/5 text-gray-300';
            span.innerHTML = `<span class="city-dot" style="width:6px;height:6px;animation:none;"></span>${c.emoji} ${c.name}`;
            badgesEl.appendChild(span);
        });

        // ============================================
        // 🚀 INIT
        // ============================================
        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 3;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x0a0a1a, 1);
            document.getElementById('globe-container').appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.minDistance = 1.5;
            controls.maxDistance = 5;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            createStars();
            createEarth();
            createAtmosphere();
            createMarkers();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('mousemove', onPointerMove);
            renderer.domElement.addEventListener('touchmove', onTouchMove, { passive: true });
            renderer.domElement.addEventListener('touchend', onTouchEnd);
            document.getElementById('toggle-mode').addEventListener('click', toggleMode);

            // Hide loading
            const loadTex = () => {
                setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1500);
            };
            loadTex();

            animate();
        }

        // ============================================
        // ⭐ STARS
        // ============================================
        function createStars() {
            const geo = new THREE.BufferGeometry();
            const count = 4000;
            const pos = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            for (let i = 0; i < count; i++) {
                pos[i * 3]     = (Math.random() - 0.5) * 200;
                pos[i * 3 + 1] = (Math.random() - 0.5) * 200;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 200;
                sizes[i] = Math.random() * 0.15 + 0.05;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12, transparent: true, opacity: 0.85 });
            stars = new THREE.Points(geo, mat);
            scene.add(stars);
        }

        // ============================================
        // 🌍 EARTH
        // ============================================
        function createEarth() {
            const loader = new THREE.TextureLoader();
            const dayTex   = loader.load(TEXTURE_CONFIG.dayTexture);
            const nightTex = loader.load(TEXTURE_CONFIG.nightTexture);
            const bumpTex  = loader.load(TEXTURE_CONFIG.bumpTexture);

            const mat = new THREE.MeshPhongMaterial({
                map: dayTex,
                bumpMap: bumpTex,
                bumpScale: 0.05,
                specular: new THREE.Color(0x222222),
                shininess: 5,
            });

            earth = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), mat);
            earth.userData = { dayTexture: dayTex, nightTexture: nightTex };
            scene.add(earth);

            scene.add(new THREE.AmbientLight(0x555555, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(5, 3, 5);
            scene.add(sun);
        }

        // ============================================
        // 🌫️ ATMOSPHERE
        // ============================================
        function createAtmosphere() {
            const vs = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`;
            const fs = `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.65 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity * 1.4;
                }`;
            const mat = new THREE.ShaderMaterial({
                vertexShader: vs,
                fragmentShader: fs,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true,
            });
            atmosphere = new THREE.Mesh(new THREE.SphereGeometry(1.18, 64, 64), mat);
            scene.add(atmosphere);
        }

        // ============================================
        // 📍 MARKERS — big enough to hover + glow ring
        // ============================================
        function latLonToVec3(lat, lon, radius) {
            const phi   = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                 radius * Math.cos(phi),
                 radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function createMarkers() {
            CITIES.forEach((city, i) => {
                const pos = latLonToVec3(city.lat, city.lon, 1.01);
                markerPositions.push(pos.clone());

                // Inner dot
                const dotGeo = new THREE.SphereGeometry(0.025, 16, 16);
                const dotMat = new THREE.MeshBasicMaterial({ color: 0xff6b6b });
                const dot = new THREE.Mesh(dotGeo, dotMat);
                dot.position.copy(pos);
                dot.userData = { cityIndex: i };
                earth.add(dot);
                markerMeshes.push(dot);

                // Glow ring
                const ringGeo = new THREE.RingGeometry(0.03, 0.06, 32);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xff6b6b,
                    transparent: true,
                    opacity: 0.35,
                    side: THREE.DoubleSide,
                });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.copy(pos);
                ring.lookAt(new THREE.Vector3(0, 0, 0)); // face outward
                ring.rotateX(Math.PI / 2);
                earth.add(ring);

                // Pole (thin line from surface outward)
                const poleMat = new THREE.LineBasicMaterial({ color: 0xff6b6b, transparent: true, opacity: 0.5 });
                const poleGeo = new THREE.BufferGeometry().setFromPoints([
                    pos.clone(),
                    pos.clone().multiplyScalar(1.06)
                ]);
                const pole = new THREE.Line(poleGeo, poleMat);
                earth.add(pole);
            });
        }

        // ============================================
        // 🔄 DAY/NIGHT TOGGLE
        // ============================================
        function toggleMode() {
            isNightMode = !isNightMode;
            const badge = document.getElementById('mode-badge');
            const btn    = document.getElementById('toggle-mode');
            if (isNightMode) {
                earth.material.map = earth.userData.nightTexture;
                earth.material.needsUpdate = true;
                badge.textContent = 'ليلي 🌙';
                badge.className = 'info-badge bg-indigo-500/20 text-indigo-400';
                btn.textContent  = '☀️ التبديل إلى الوضع النهاري';
            } else {
                earth.material.map = earth.userData.dayTexture;
                earth.material.needsUpdate = true;
                badge.textContent = 'نهاري ☀️';
                badge.className = 'info-badge bg-yellow-500/20 text-yellow-400';
                btn.textContent  = '🌙 التبديل إلى الوضع الليلي';
            }
        }

        // ============================================
        // 🖱️ POINTER / TOUCH
        // ============================================
        function onPointerMove(e) {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            detectHover();
        }
        function onTouchMove(e) {
            if (e.touches.length === 1) {
                const t = e.touches[0];
                mouse.x = (t.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(t.clientY / window.innerHeight) * 2 + 1;
                detectHover();
            }
        }
        function onTouchEnd() {
            hoveredCity = null;
            hideLabel();
            controls.autoRotate = true;
        }

        // ============================================
        // 🔍 HOVER DETECTION — raycast on Earth, find nearest city
        // ============================================
        function detectHover() {
            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObject(earth, false);

            if (hits.length === 0) {
                hoveredCity = null;
                hideLabel();
                controls.autoRotate = true;
                resetMarkerColors();
                return;
            }

            const hitPoint = hits[0].point.clone();
            // Convert to earth local space
            earth.worldToLocal(hitPoint);
            hitPoint.normalize();

            // Find closest city
            let bestDist = Infinity;
            let bestIdx = -1;
            for (let i = 0; i < markerPositions.length; i++) {
                const dir = markerPositions[i].clone().normalize();
                const dist = hitPoint.angleTo(dir);
                if (dist < bestDist) {
                    bestDist = dist;
                    bestIdx = i;
                }
            }

            if (bestDist < HOVER_THRESHOLD && bestIdx >= 0) {
                hoveredCity = bestIdx;
                showLabel(bestIdx);
                controls.autoRotate = false;
                highlightMarker(bestIdx);
            } else {
                hoveredCity = null;
                hideLabel();
                controls.autoRotate = true;
                resetMarkerColors();
            }
        }

        // ============================================
        // 🏷️ LABEL SHOW / HIDE
        // ============================================
        function showLabel(idx) {
            const city = CITIES[idx];
            const pos = markerPositions[idx].clone();
            // Local position on sphere surface — push slightly above
            pos.multiplyScalar(1.08);
            // Convert to world for screen projection
            const worldPos = pos.clone();
            earth.localToWorld(worldPos);
            const screen = worldPos.clone().project(camera);
            const x = (screen.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(screen.y * 0.5) + 0.5) * window.innerHeight;

            const container = document.getElementById('marker-labels');
            container.innerHTML = '';
            const lbl = document.createElement('div');
            lbl.className = 'marker-label';
            lbl.innerHTML = `<div class="font-bold" style="color:#a5b4fc">${city.emoji} ${city.name}</div>
                             <div class="text-xs" style="color:#9ca3af">${city.country}</div>`;
            lbl.style.left = `${x}px`;
            lbl.style.top  = `${y}px`;
            container.appendChild(lbl);
        }

        function hideLabel() {
            document.getElementById('marker-labels').innerHTML = '';
        }

        // ============================================
        // 🎨 MARKER HIGHLIGHT
        // ============================================
        function highlightMarker(idx) {
            markerMeshes.forEach((m, i) => {
                if (i === idx) {
                    m.material.color.setHex(0x00ff88);
                    m.scale.set(1.8, 1.8, 1.8);
                } else {
                    m.material.color.setHex(0xff6b6b);
                    m.scale.set(1, 1, 1);
                }
            });
        }
        function resetMarkerColors() {
            markerMeshes.forEach(m => {
                m.material.color.setHex(0xff6b6b);
                m.scale.set(1, 1, 1);
            });
        }

        // ============================================
        // 📐 RESIZE
        // ============================================
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // 🎬 ANIMATE
        // ============================================
        function animate() {
            requestAnimationFrame(animate);
            if (stars) stars.rotation.y += 0.00008;
            controls.update();

            // Keep updating label position while hovering
            if (hoveredCity !== null) {
                showLabel(hoveredCity);
            }

            renderer.render(scene, camera);
        }

        // ============================================
        // 🚀 START
        // ============================================
        init();
    </script>
</body>
</html>
