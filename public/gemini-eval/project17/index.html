<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم Gemini - مشروع 17</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #e8f0fe; color: #1a73e8; padding: 5px 10px; border-radius: 20px; font-size: 14px; }
        .qa-box { margin-bottom: 30px; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
        .question { background: #e8f0fe; padding: 15px; border-bottom: 1px solid #ddd; font-weight: bold; }
        .answer { background: #fff; padding: 15px; }
        .timestamp { font-size: 12px; color: #666; margin-top: 10px; text-align: left; }
        pre { background: #2d2d2d; color: #ccc; padding: 15px; border-radius: 5px; overflow-x: auto; direction: ltr; text-align: left; font-family: Consolas, monospace; }
        code { font-family: Consolas, monospace; background: #eee; padding: 2px 5px; border-radius: 3px; }
        .loading { text-align: center; color: #666; font-style: italic; padding: 20px; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #1a73e8; text-decoration: none; }
        .back-btn:hover { text-decoration: underline; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <a href="/gemini" class="back-btn">→ العودة إلى قائمة المشاريع</a>
        <h1>
            مختبر تقييم Gemini - المشروع 17
            <span class="badge">تحديث تلقائي</span>
        </h1>
        <p>هذه الصفحة تعرض الأسئلة الموجهة لنموذج Gemini وإجاباته بشكل مباشر. يتم التحديث كل 5 ثوانٍ.</p>
        
        <div id="content">
            <div class="loading">جاري تحميل البيانات...</div>
        </div>
    </div>

    <script>
        function loadData() {
            fetch('update.php')
                .then(response => response.json())
                .then(data => {
                    const contentDiv = document.getElementById('content');
                    if (!data || data.length === 0) {
                        contentDiv.innerHTML = '<div class="loading">في انتظار السؤال الأول...</div>';
                        return;
                    }
                    
                    let html = '';
                    // عرض الأحدث أولاً
                    [...data].reverse().forEach(item => {
                        html += `
                            <div class="qa-box">
                                <div class="question">
                                    <span style="color:#1a73e8">سؤال ${item.id}:</span> ${marked.parseInline(item.question)}
                                </div>
                                <div class="answer">
                                    ${marked.parse(item.answer)}
                                    <div class="timestamp">${item.timestamp}</div>
                                </div>
                            </div>
                        `;
                    });
                    contentDiv.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                });
        }

        // تحميل البيانات عند فتح الصفحة
        loadData();
        
        // تحديث البيانات كل 5 ثواني
        setInterval(loadData, 5000);
    </script>
</body>
</html>
