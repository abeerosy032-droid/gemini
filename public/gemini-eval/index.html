<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تقييم Gemini - نتائج الجلسات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        .header h1 {
            color: #00ff88;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #888;
            font-size: 1.1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .stat-card h3 {
            color: #00ff88;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #888;
            font-size: 0.9em;
        }

        .sessions-list {
            display: grid;
            gap: 20px;
        }

        .session-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 136, 0.1);
            transition: all 0.3s ease;
        }

        .session-card:hover {
            border-color: rgba(0, 255, 136, 0.3);
            transform: translateY(-2px);
        }

        .session-header {
            padding: 20px;
            background: rgba(0, 255, 136, 0.1);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .session-header h3 {
            color: #00ff88;
            font-size: 1.2em;
        }

        .session-header .meta {
            color: #888;
            font-size: 0.9em;
        }

        .session-content {
            padding: 20px;
            display: none;
        }

        .session-content.active {
            display: block;
        }

        .message {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            border-right: 4px solid;
        }

        .message.user {
            background: rgba(100, 100, 255, 0.1);
            border-color: #6464ff;
        }

        .message.assistant {
            background: rgba(0, 255, 136, 0.1);
            border-color: #00ff88;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9em;
            color: #888;
        }

        .message-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-content code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .message-content pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .message-content pre code {
            background: none;
            padding: 0;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #00ff88;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.4);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #00ff88;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💎 تقييم Gemini</h1>
            <p>نتائج الجلسات والأسئلة والردود</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalSessions">0</h3>
                <p>إجمالي الجلسات</p>
            </div>
            <div class="stat-card">
                <h3 id="totalMessages">0</h3>
                <p>إجمالي الرسائل</p>
            </div>
            <div class="stat-card">
                <h3 id="avgResponseTime">-</h3>
                <p>متوسط وقت الرد</p>
            </div>
        </div>

        <div id="sessionsList" class="sessions-list">
            <div class="loading">جاري تحميل البيانات</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadData()">🔄 تحديث</button>

    <script>
        let sessionsData = null;

        async function loadData() {
            const container = document.getElementById('sessionsList');
            container.innerHTML = '<div class="loading">جاري تحميل البيانات</div>';

            try {
                const response = await fetch('gemini-sessions.json');
                if (!response.ok) throw new Error('Failed to load data');

                sessionsData = await response.json();
                renderSessions();
            } catch (error) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>لا توجد جلسات بعد</h2>
                        <p>ابدأ بإرسال أسئلة لتقييم نموذج Gemini</p>
                    </div>
                `;
                updateStats(null);
            }
        }

        function renderSessions() {
            const container = document.getElementById('sessionsList');

            if (!sessionsData || sessionsData.sessions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h2>لا توجد جلسات بعد</h2>
                        <p>ابدأ بإرسال أسئلة لتقييم نموذج Gemini</p>
                    </div>
                `;
                updateStats(null);
                return;
            }

            container.innerHTML = sessionsData.sessions.map((session, index) => `
                <div class="session-card">
                    <div class="session-header" onclick="toggleSession(${index})">
                        <h3>📅 ${session.date} - ${session.title || 'جلسة ' + (index + 1)}</h3>
                        <span class="meta">${session.messages.length} رسالة</span>
                    </div>
                    <div class="session-content" id="session-${index}">
                        ${session.messages.map(msg => `
                            <div class="message ${msg.role}">
                                <div class="message-header">
                                    <strong>${msg.role === 'user' ? '👤 المستخدم' : '💎 Gemini'}</strong>
                                    <span>${msg.timestamp || ''}</span>
                                </div>
                                <div class="message-content">${formatMessage(msg.content)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');

            updateStats(sessionsData);
        }

        function formatMessage(content) {
            // Simple markdown-like formatting
            return content
                .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function toggleSession(index) {
            const content = document.getElementById(`session-${index}`);
            content.classList.toggle('active');
        }

        function updateStats(data) {
            if (!data) {
                document.getElementById('totalSessions').textContent = '0';
                document.getElementById('totalMessages').textContent = '0';
                document.getElementById('avgResponseTime').textContent = '-';
                return;
            }

            const totalSessions = data.sessions.length;
            const totalMessages = data.sessions.reduce((sum, s) => sum + s.messages.length, 0);

            document.getElementById('totalSessions').textContent = totalSessions;
            document.getElementById('totalMessages').textContent = totalMessages;
            document.getElementById('avgResponseTime').textContent = data.avgResponseTime || '-';
        }

        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);

        // Initial load
        loadData();
    </script>
</body>
</html>
