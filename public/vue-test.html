<!DOCTYPE html>
<html>
<body>
<div id="app">
  <h1>{{ message }}</h1>
  <button @click="count++">Clicked {{ count }} times</button>
</div>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const message = ref('Hello Vue!');
    const count = ref(0);
    return { message, count };
  }
}).mount('#app');
</script>
</html>
</html>
