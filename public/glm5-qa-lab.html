<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 تقييم GLM-5.1 — أسئلة وأجوبة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0a0a2e 100%);
            border-bottom: 2px solid #7c3aed;
            padding: 30px 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(90deg, #a78bfa, #7c3aed, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        
        .header .subtitle {
            color: #9ca3af;
            font-size: 0.95rem;
        }
        
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat .num {
            font-size: 1.8rem;
            font-weight: 700;
            color: #7c3aed;
        }
        
        .stat .label {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 2px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .qa-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            margin-bottom: 24px;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        
        .qa-card:hover {
            border-color: #7c3aed44;
        }
        
        .qa-header {
            background: linear-gradient(90deg, #1e1b4b, #1e1b4b88);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .qa-number {
            background: #7c3aed;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.95rem;
        }
        
        .qa-category {
            background: #7c3aed22;
            color: #a78bfa;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        .qa-body {
            padding: 20px;
        }
        
        .question-section {
            margin-bottom: 16px;
        }
        
        .section-label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .question-text {
            background: #1f2937;
            border-right: 3px solid #7c3aed;
            padding: 14px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 1rem;
            line-height: 1.7;
            color: #f3f4f6;
        }
        
        .answer-text {
            background: #0f172a;
            border-right: 3px solid #22c55e;
            padding: 16px 18px;
            border-radius: 0 10px 10px 0;
            font-size: 0.95rem;
            line-height: 1.85;
            color: #d1d5db;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .qa-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #1f2937;
            font-size: 0.78rem;
            color: #4b5563;
        }
        
        .response-time {
            background: #1f2937;
            padding: 3px 10px;
            border-radius: 10px;
        }
        
        .rating-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.78rem;
        }
        
        .rating-excellent { background: #22c55e22; color: #22c55e; }
        .rating-good { background: #3b82f622; color: #3b82f6; }
        .rating-fair { background: #f59e0b22; color: #f59e0b; }
        .rating-poor { background: #ef444422; color: #ef4444; }
        .rating-pending { background: #6b728022; color: #6b7280; }
        
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #4b5563;
        }
        
        .empty-state .icon {
            font-size: 4rem;
            margin-bottom: 16px;
        }
        
        .empty-state p {
            font-size: 1.1rem;
        }
        
        .empty-state .hint {
            font-size: 0.85rem;
            margin-top: 8px;
            color: #374151;
        }
        
        .auto-refresh {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 0.8rem;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 تقييم GLM-5.1</h1>
        <div class="subtitle">اختبار الأسئلة والأجوبة — تقييم مباشر</div>
        <div class="stats-bar">
            <div class="stat">
                <div class="num" id="totalCount">0</div>
                <div class="label">سؤال</div>
            </div>
            <div class="stat">
                <div class="num" id="avgTime">—</div>
                <div class="label">متوسط الوقت</div>
            </div>
            <div class="stat">
                <div class="num" id="lastUpdate">—</div>
                <div class="label">آخر تحديث</div>
            </div>
        </div>
    </div>
    
    <div class="container" id="qaContainer">
        <div class="empty-state">
            <div class="icon">🧪</div>
            <p>في انتظار الأسئلة...</p>
            <div class="hint">سيتم عرض الأسئلة والأجوبة هنا تلقائياً</div>
        </div>
    </div>
    
    <div class="auto-refresh">
        <div class="refresh-dot"></div>
        <span>تحديث تلقائي كل 5 ثوان</span>
    </div>

    <script>
        const DATA_URL = '/glm5-qa-data.json';
        
        async function loadData() {
            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                const data = await res.json();
                render(data);
            } catch (e) {
                console.error('Load error:', e);
            }
        }
        
        function render(data) {
            const container = document.getElementById('qaContainer');
            const questions = data.questions || [];
            
            document.getElementById('totalCount').textContent = questions.length;
            
            if (questions.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🧪</div>
                        <p>في انتظار الأسئلة...</p>
                        <div class="hint">سيتم عرض الأسئلة والأجوبة هنا تلقائياً</div>
                    </div>`;
                return;
            }
            
            // Calculate stats
            const times = questions.filter(q => q.responseTime).map(q => q.responseTime);
            const avg = times.length ? (times.reduce((a,b) => a+b, 0) / times.length).toFixed(1) : '—';
            document.getElementById('avgTime').textContent = avg + 's';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('ar');
            
            let html = '';
            questions.forEach((q, i) => {
                const ratingClass = q.rating ? `rating-${q.rating}` : 'rating-pending';
                const ratingText = {
                    'excellent': 'ممتاز ⭐',
                    'good': 'جيد 👍',
                    'fair': 'مقبول ⚠️',
                    'poor': 'ضعيف ❌',
                    'pending': 'بانتظار التقييم'
                }[q.rating] || 'بانتظار التقييم';
                
                html += `
                <div class="qa-card">
                    <div class="qa-header">
                        <div class="qa-number">${i + 1}</div>
                        <span class="qa-category">${q.category || 'عام'}</span>
                    </div>
                    <div class="qa-body">
                        <div class="question-section">
                            <div class="section-label">❓ السؤال</div>
                            <div class="question-text">${escapeHtml(q.question)}</div>
                        </div>
                        <div class="question-section">
                            <div class="section-label">💬 الإجابة</div>
                            <div class="answer-text">${escapeHtml(q.answer)}</div>
                        </div>
                        <div class="qa-meta">
                            <span class="response-time">⏱ ${q.responseTime ? q.responseTime + 's' : '—'}</span>
                            <span class="rating-badge ${ratingClass}">${ratingText}</span>
                            <span>${q.timestamp || ''}</span>
                        </div>
                    </div>
                </div>`;
            });
            
            container.innerHTML = html;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;')
                       .replace(/</g, '&lt;')
                       .replace(/>/g, '&gt;')
                       .replace(/\n/g, '<br>');
        }
        
        loadData();
        setInterval(loadData, 5000);
    </script>
</body>
</html>
